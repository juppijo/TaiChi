<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>8 Brokate · Baduanjin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f5f0;--bg2:#edeae3;
  --surf:rgba(255,255,255,0.80);--text:#2a3328;
  --muted:#7a8a78;--accent:#4e7244;--acc2:#9ab58a;
  --brd:rgba(78,114,68,0.18);--brd2:rgba(78,114,68,0.07);
  --bbg:rgba(255,255,255,0.86);--bhov:rgba(78,114,68,0.10);
  --tc:#4e7244;--tt:rgba(78,114,68,0.09);
}
[data-theme="dark"]{
  --bg:#141a14;--bg2:#1b231b;
  --surf:rgba(24,34,24,0.90);--text:#ccdfc4;
  --muted:#6e8e66;--accent:#88bb7a;--acc2:#4a6a40;
  --brd:rgba(100,160,80,0.20);--brd2:rgba(100,160,80,0.07);
  --bbg:rgba(28,42,28,0.92);--bhov:rgba(88,150,70,0.16);
  --tc:#88bb7a;--tt:rgba(88,150,70,0.10);
}
[data-theme="zen"]{
  --bg:#fafaf8;--bg2:#f2f2f0;
  --surf:rgba(255,255,255,0.65);--text:#1a1a18;
  --muted:#8c8c88;--accent:#303030;--acc2:#909090;
  --brd:rgba(0,0,0,0.10);--brd2:rgba(0,0,0,0.04);
  --bbg:rgba(255,255,255,0.70);--bhov:rgba(0,0,0,0.055);
  --tc:#303030;--tt:rgba(0,0,0,0.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-tap-highlight-color:transparent}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Lora',serif;transition:background .35s,color .35s}

/* ── SHELL ── */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* ── TOP BAR ── */
.topbar{background:var(--surf);border-bottom:1px solid var(--brd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex-shrink:0;z-index:10}
.topbar-inner{display:flex;align-items:center;gap:6px;padding:0 14px;height:50px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.topbar-inner::-webkit-scrollbar{display:none}
.brand{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:300;color:var(--accent);letter-spacing:.05em;white-space:nowrap;margin-right:4px;flex-shrink:0}
.divider{width:1px;height:22px;background:var(--brd);flex-shrink:0;margin:0 2px}
.sp{flex:1;min-width:4px}

/* ── BUTTONS ── */
.btn{background:var(--bbg);border:1px solid var(--brd);color:var(--text);border-radius:5px;padding:0 11px;height:34px;font-family:'Lora',serif;font-size:.76rem;cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:4px;transition:background .16s,transform .1s,border-color .18s}
.btn:hover{background:var(--bhov);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.pri:hover{opacity:.88}
.btn.lit{color:var(--accent);border-color:var(--acc2)}
.time-wrap{display:flex;align-items:center;gap:5px;font-size:.76rem;flex-shrink:0;color:var(--muted)}
.time-wrap input{width:44px;height:32px;background:var(--bbg);border:1px solid var(--brd);border-radius:5px;color:var(--text);font-family:'Cormorant Garamond',serif;font-size:.95rem;text-align:center;transition:border-color .18s}
.time-wrap input:focus{outline:none;border-color:var(--accent)}
.themes{display:flex;gap:4px;flex-shrink:0}
.tb{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .18s,border-color .18s;flex-shrink:0}
.tb:hover{transform:scale(1.14)}
.tb.on{border-color:var(--accent)}
.tb.light{background:#f0ece4}
.tb.dark{background:#1b231b}
.tb.zen{background:conic-gradient(#fafaf8 0deg 180deg,#1a1a18 180deg)}

/* ── PROGRESS ── */
.prog{height:3px;background:var(--brd);flex-shrink:0;position:relative}
.prog-fill{position:absolute;inset:0;right:auto;background:var(--accent);transition:width .9s linear;width:0%}

/* ── BODY ── */
.body{display:flex;flex:1;overflow:hidden;min-height:0}

/* ── SIDEBAR ── */
.sidebar{width:250px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--brd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:18px 18px 14px;border-bottom:1px solid var(--brd);flex-shrink:0}
.sb-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;color:var(--accent);letter-spacing:.06em;line-height:1}
.sb-sub{font-size:.7rem;font-style:italic;color:var(--muted);letter-spacing:.12em;margin-top:3px;display:block}
.nav-list{list-style:none;overflow-y:auto;flex:1;padding:8px 6px 14px}
.nav-list::-webkit-scrollbar{width:3px}
.nav-list::-webkit-scrollbar-thumb{background:var(--acc2);border-radius:2px}
.nav-btn{width:100%;text-align:left;background:none;border:none;cursor:pointer;color:var(--text);font-family:'Lora',serif;font-size:.80rem;line-height:1.35;padding:8px 10px;border-radius:5px;display:flex;align-items:flex-start;gap:9px;transition:background .16s,color .16s;margin-bottom:1px}
.nav-btn:hover{background:var(--bhov)}
.nav-btn.active{background:var(--bhov);color:var(--accent)}
.nav-num{font-family:'Cormorant Garamond',serif;font-size:1.05rem;line-height:1.1;color:var(--acc2);min-width:16px;flex-shrink:0}
.nav-check{margin-left:auto;color:var(--accent);font-size:.78rem;opacity:0;flex-shrink:0}
.nav-btn.done .nav-check{opacity:1}

/* ── CONTENT ── */
.content{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0;overflow:hidden}

/* ── IMAGE PANEL ── */
.img-panel{background:var(--bg2);position:relative;overflow:hidden;border-right:1px solid var(--brd2);cursor:zoom-in}
.big-num{position:absolute;top:12px;left:14px;font-family:'Cormorant Garamond',serif;font-size:4.5rem;font-weight:300;line-height:1;color:var(--brd);pointer-events:none;user-select:none}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .85s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px;box-shadow:0 6px 28px rgba(0,0,0,.07);transition:transform .3s ease}
.img-panel:hover .slide.on img{transform:scale(1.02)}
.img-hint{position:absolute;bottom:11px;right:12px;font-size:.6rem;color:var(--muted);letter-spacing:.08em;pointer-events:none;opacity:.7}
.img-dots-panel{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}
.dot{width:5px;height:5px;border-radius:50%;background:var(--acc2);opacity:.35;transition:opacity .3s,transform .3s}
.dot.on{opacity:1;transform:scale(1.35)}

/* ── INFO PANEL ── */
.info-panel{padding:24px 26px;overflow-y:auto;background:var(--bg);display:flex;flex-direction:column;gap:13px}
.info-panel::-webkit-scrollbar{width:3px}
.info-panel::-webkit-scrollbar-thumb{background:var(--acc2);border-radius:2px}
.ex-title{font-family:'Cormorant Garamond',serif;font-size:1.65rem;font-weight:400;line-height:1.2;color:var(--accent)}
.ex-cn{font-size:.72rem;font-style:italic;color:var(--muted);letter-spacing:.06em}
.timer-row{display:flex;align-items:center;gap:14px;padding:8px 0}
.ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--tt);stroke-width:5}
.ring-arc{fill:none;stroke:var(--tc);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .95s linear}
.ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--accent)}
.timer-meta{flex:1}
.timer-lbl{font-size:.64rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:3px}
.timer-tot{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--text)}
.icard{background:var(--surf);border-left:2px solid var(--acc2);border-radius:0 5px 5px 0;padding:12px 15px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.icard-lbl{font-size:.64rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:5px}
.icard-txt{font-size:.86rem;line-height:1.75}

@keyframes fadeup{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.info-panel>*{animation:fadeup .36s ease both}
.info-panel>*:nth-child(2){animation-delay:.04s}
.info-panel>*:nth-child(3){animation-delay:.09s}
.info-panel>*:nth-child(4){animation-delay:.14s}
.info-panel>*:nth-child(5){animation-delay:.19s}

/* ── LIGHTBOX ── */
.lb{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .26s ease}
.lb.open{opacity:1;pointer-events:auto}
.lb-img-wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:64px 56px 8px}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;box-shadow:0 0 80px rgba(0,0,0,.5);transition:opacity .55s ease,transform .55s ease}
.lb-img.fade{opacity:0;transform:scale(.97)}
.lb-dots-lb{display:flex;gap:9px;padding-bottom:22px;flex-shrink:0}
.lb-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:background .25s,transform .25s}
.lb-dot.on{background:#fff;transform:scale(1.3)}
.lb-close{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;cursor:pointer;font-size:1.5rem;line-height:1;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .18s}
.lb-close:hover{background:rgba(255,255,255,.15)}
.lb-counter{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-family:'Cormorant Garamond',serif;font-size:1rem;color:rgba(255,255,255,.5);letter-spacing:.1em;white-space:nowrap}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#fff;cursor:pointer;font-size:1.3rem;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .18s}
.lb-nav:hover{background:rgba(255,255,255,.14)}
.lb-prev{left:14px}
.lb-next{right:14px}

/* ── RESPONSIVE ── */
@media(max-width:860px){
  .sidebar{display:none}
  .content{grid-template-columns:1fr;grid-template-rows:44vw 1fr}
  .img-panel{border-right:none;border-bottom:1px solid var(--brd2)}
  .big-num{font-size:3.2rem}
}
@media(max-width:560px){
  .brand{font-size:1.1rem}
  .btn{padding:0 9px;font-size:.72rem;height:32px}
  .time-wrap input{width:40px;height:30px}
  .topbar-inner{height:46px;padding:0 10px;gap:5px}
  .content{grid-template-rows:40vw 1fr}
  .info-panel{padding:14px 14px}
  .ex-title{font-size:1.3rem}
  .icard-txt{font-size:.82rem}
  .lb-nav{width:38px;height:38px;font-size:1.1rem}
}
@media(max-width:360px){
  .content{grid-template-rows:36vw 1fr}
}
:fullscreen .app,:-webkit-full-screen .app{height:100dvh}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">8 Brokate</span>
      <div class="divider"></div>
      <button class="btn" onclick="goPrev()" title="Zurück">&#9664;</button>
      <button class="btn pri" id="ppBtn" onclick="togglePlay()">&#9654; Start</button>
      <button class="btn" onclick="goNext()" title="Nächste">&#9654;&#9654;</button>
      <div class="sp"></div>
      <div class="time-wrap">
        <span>&#8987;</span>
        <input type="number" id="minInput" value="8" min="1" max="99" onchange="resetTimer()">
        <span>min</span>
      </div>
      <button class="btn" id="musicBtn" onclick="toggleMusic()">&#9836; Musik</button>
      <button class="btn lit" id="gongBtn" onclick="toggleGong()">&#9679; Gong</button>
      <div class="themes">
        <button class="tb light on" id="tl" onclick="setTheme('light')" title="Hell"></button>
        <button class="tb zen"      id="tz" onclick="setTheme('zen')"   title="Zen"></button>
        <button class="tb dark"     id="td" onclick="setTheme('dark')"  title="Dunkel"></button>
      </div>
      <button class="btn" onclick="goFullscreen()" title="Vollbild">&#9974;</button>
    </div>
  </header>

  <!-- PROGRESS LINE -->
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>

  <!-- BODY -->
  <div class="body">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sb-head">
        <div class="sb-title">8 Brokate</div>
        <span class="sb-sub">八段锦 · Baduanjin</span>
      </div>
      <ul class="nav-list" id="navList"></ul>
    </aside>

    <!-- CONTENT -->
    <div class="content">
      <div class="img-panel" id="imgPanel" onclick="openLb()" role="button" aria-label="Bild vergrößern" tabindex="0">
        <div class="big-num" id="bigNum">01</div>
        <div class="img-dots-panel" id="panelDots"></div>
        <div class="img-hint">&#128269; Tippen zum Vergrößern</div>
      </div>
      <div class="info-panel" id="infoPanel"></div>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <button class="lb-close" onclick="closeLb()">&#215;</button>
  <div class="lb-counter" id="lbCounter"></div>
  <div class="lb-img-wrap" onclick="lbWrapClick(event)">
    <img class="lb-img" id="lbImg" src="" alt="">
  </div>
  <div class="lb-dots-lb" id="lbDots"></div>
  <button class="lb-nav lb-prev" onclick="lbStep(-1)">&#10094;</button>
  <button class="lb-nav lb-next" onclick="lbStep(1)">&#10095;</button>
</div>

<script>
const EX=[
  {num:1,title:"Zwei Hände stützen den Himmel",
   cn:"Shuang Shou Tuo Tian Li San Jiao",
   imgs:["images/image8.png","images/image16.png"],
   anl:"Aus der Grundposition einatmen, Hände nach oben führen und in Brusthöhe verhaken. Über den Kopf nach oben drehen (evtl. auf Zehenspitzen). Beim Ausatmen leicht in die Knie gehen, Arme zur Erde führen. 3–9 Mal wiederholen.",
   wkg:"Reguliert den <em>Dreifachen Erwärmer</em>, streckt die Wirbelsäule und hilft bei Fatigue."},
  {num:2,title:"Den Bogen spannen und auf den Adler zielen",
   cn:"Zuo You Kai Gong Si She Diao",
   imgs:["images/image11.png","images/image9.png"],
   anl:"Im Reiterstand den Bogen spannen. Die vordere Hand formt ein »L« mit Daumen und Zeigefinger. Fokus und Blick scharf halten. 3–9 Mal pro Seite.",
   wkg:"Stärkt Herz, Lunge und Beine. Verbessert Konzentration und wirkt auf den Lebermeridian."},
  {num:3,title:"Himmel und Erde verbinden",
   cn:"Tiao Li Pi Wei Dan Ju Shou",
   imgs:["images/image12.png","images/image4.png","images/image17.png"],
   anl:"Die Hände kraftvoll auseinanderpressen (eine zum Himmel, eine zur Erde). 3–9 Mal pro Seite.",
   wkg:"Stärkt Milz und Magen (Erdelement). Wirkt zentrierend und stabilisierend."},
  {num:4,title:"Die 5 Übel & 7 Leiden hinter sich lassen",
   cn:"Wu Lao Qi Shang Xiang Hou Qiao",
   imgs:["images/image5.png","images/image2.png"],
   anl:"Beim Ausatmen zur Seite schauen, Arme öffnen (Handflächen nach vorn). Einatmen zur Mitte. 3–9 Mal pro Seite.",
   wkg:"Stärkt Nacken und Augen. Reguliert das Nervensystem bei Schlaflosigkeit und Reizbarkeit."},
  {num:5,title:"Die Ente wackelt mit dem Schwanz",
   cn:"Yao Tou Bai Wei Qu Xin Huo",
   imgs:["images/image1.png","images/image19.png"],
   anl:"Im weiten Stand den Oberkörper kreisend von einem Bein zum anderen führen. 3–9 Zyklen.",
   wkg:"Eliminiert »Herzfeuer«, beruhigt den Geist und hilft bei innerer Unruhe."},
  {num:6,title:"Nach vorne beugen, um die Nieren zu stärken",
   cn:"Liang Shou Pan Jiao Gu Shen Yao",
   imgs:["images/image15.png","images/image14.png","images/image10.png"],
   anl:"Hände auf Nierenhöhe, beim Ausatmen an den Beinrückseiten entlang nach unten streichen. 3–9 Mal.",
   wkg:"Stärkt Nieren und Lendenwirbelsäule. <strong>Achtung bei Bluthochdruck!</strong>"},
  {num:7,title:"Mit den Fäusten stoßen & mit den Augen funkeln",
   cn:"Wo Quan Nu Mu Zheng Qi Li",
   imgs:["images/image3.png","images/image6.png"],
   anl:"Aus der Taille heraus boxen, dabei einen fokussierten, zornigen Blick bewahren. 3–9 Mal.",
   wkg:"Vermehrt Qi und Stärke, vermindert Ärger, hilft bei der Entgiftung der Leber."},
  {num:8,title:"Den Rücken schütteln",
   cn:"Bei Hou Qi Dian Bai Bing Xiao",
   imgs:["images/image18.png","images/image7.png"],
   anl:"Auf die Fußballen kommen und die Fersen sanft in den Boden sinken lassen (erschüttern). 3–9 Mal.",
   wkg:"Vertreibt trübes Qi, energetisiert bei Müdigkeit und verteilt die Energie im ganzen Körper."}
];

let idx=0,imgIdx=0,imgTmr=null,sesTmr=null;
let playing=false,musicOn=false,gongOn=true;
let totalSec=8*60,perSec=totalSec/EX.length,remPer=perSec,remTot=totalSec;
let done=new Set(),musicAud=null,gongAud=null;
let lbIdx=0,lbTmr=null;

/* ── NAV ── */
function buildNav(){
  document.getElementById('navList').innerHTML=EX.map((e,i)=>`
    <li><button class="nav-btn${i===idx?' active':''}${done.has(i)?' done':''}" onclick="jumpTo(${i})">
      <span class="nav-num">${e.num}</span><span>${e.title}</span>
      <span class="nav-check">&#10003;</span>
    </button></li>`).join('');
}

/* ── RENDER ── */
function render(){
  const e=EX[idx];
  document.getElementById('bigNum').textContent=String(e.num).padStart(2,'0');
  /* slides */
  const panel=document.getElementById('imgPanel');
  panel.querySelectorAll('.slide').forEach(s=>s.remove());
  e.imgs.forEach((src,i)=>{
    const d=document.createElement('div');
    d.className='slide'+(i===0?' on':'');
    const img=document.createElement('img');
    img.src=src;img.alt=e.title;img.draggable=false;
    d.appendChild(img);
    panel.insertBefore(d,document.getElementById('panelDots'));
  });
  imgIdx=0;
  mkDots('panelDots',e.imgs.length,0,false);
  /* info */
  const c=(2*Math.PI*31).toFixed(2);
  document.getElementById('infoPanel').innerHTML=`
    <div class="ex-title">${e.title}</div>
    <div class="ex-cn">${e.cn}</div>
    <div class="timer-row">
      <div class="ring-wrap">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle class="ring-bg" cx="36" cy="36" r="31"/>
          <circle class="ring-arc" id="arc" cx="36" cy="36" r="31" stroke-dasharray="${c}" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-txt" id="ringTxt">${fmt(remPer)}</div>
      </div>
      <div class="timer-meta">
        <div class="timer-lbl">Übungszeit pro Brokat</div>
        <div class="timer-tot" id="totTxt">${fmt(remTot)} gesamt</div>
      </div>
    </div>
    <div class="icard"><div class="icard-lbl">Anleitung</div><div class="icard-txt">${e.anl}</div></div>
    <div class="icard"><div class="icard-lbl">Wirkung</div><div class="icard-txt">${e.wkg}</div></div>`;
  updateArc();buildNav();updateProg();
}

function mkDots(id,count,active,clickable){
  document.getElementById(id).innerHTML=
    Array.from({length:count},(_,i)=>`<div class="dot${i===active?' on':''}"${clickable?` onclick="lbGo(${i})" style="cursor:pointer"`:''} ></div>`).join('');
}

/* ── TIMER ── */
function fmt(s){s=Math.max(0,Math.floor(s));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function updateArc(){
  const a=document.getElementById('arc'),t=document.getElementById('ringTxt');
  if(!a||!t)return;
  const c=2*Math.PI*31,f=Math.max(0,remPer/perSec);
  a.style.strokeDashoffset=(c*(1-f)).toFixed(2);t.textContent=fmt(remPer);
}
function updateProg(){
  const f=document.getElementById('progFill');
  if(f)f.style.width=(Math.max(0,(totalSec-remTot)/totalSec)*100).toFixed(2)+'%';
  const t=document.getElementById('totTxt');
  if(t)t.textContent=fmt(remTot)+' gesamt';
}

/* ── PLAY ── */
function togglePlay(){playing?pause():play()}
function play(){
  playing=true;
  document.getElementById('ppBtn').innerHTML='&#9646;&#9646; Pause';
  startImgCycle();tryMusic();
  sesTmr=setInterval(tick,1000);
}
function pause(){
  playing=false;clearInterval(sesTmr);clearInterval(imgTmr);
  document.getElementById('ppBtn').innerHTML='&#9654; Weiter';
  if(musicAud)musicAud.pause();
}
function tick(){
  remPer--;remTot--;updateArc();updateProg();
  if(remPer<=0){
    done.add(idx);
    if(idx<EX.length-1){
      fireGong();clearInterval(imgTmr);
      setTimeout(()=>{idx++;remPer=perSec;render();if(playing)startImgCycle();},700);
    } else {
      clearInterval(sesTmr);playing=false;done.add(idx);
      document.getElementById('ppBtn').innerHTML='&#10003; Beendet';
      if(musicAud)musicAud.pause();fireGong();buildNav();
    }
  }
  if(remTot<=0){clearInterval(sesTmr);playing=false;}
}

/* ── IMG CYCLE ── */
function startImgCycle(){
  clearInterval(imgTmr);
  if(EX[idx].imgs.length<2)return;
  imgTmr=setInterval(()=>stepSlide(1),4200);
}
function stepSlide(dir){
  const slides=document.querySelectorAll('.slide');
  const dots=document.querySelectorAll('#panelDots .dot');
  if(!slides.length)return;
  slides[imgIdx].classList.remove('on');
  if(dots[imgIdx])dots[imgIdx].classList.remove('on');
  imgIdx=(imgIdx+dir+EX[idx].imgs.length)%EX[idx].imgs.length;
  slides[imgIdx].classList.add('on');
  if(dots[imgIdx])dots[imgIdx].classList.add('on');
}

/* ── NAV ── */
function jumpTo(i){if(playing)pause();idx=i;remPer=perSec;render();}
function goPrev(){if(playing)pause();if(idx>0){idx--;remPer=perSec;render();}}
function goNext(){if(playing)pause();if(idx<EX.length-1){idx++;remPer=perSec;render();}}
function resetTimer(){
  const v=parseInt(document.getElementById('minInput').value)||8;
  totalSec=v*60;perSec=totalSec/EX.length;remTot=totalSec;remPer=perSec;
  if(playing)pause();render();
}

/* ── AUDIO ── */
function tryMusic(){
  if(!musicOn)return;
  if(!musicAud){musicAud=new Audio('QiGong.mp3');musicAud.loop=true;musicAud.volume=.45;}
  musicAud.play().catch(()=>{});
}
function toggleMusic(){
  musicOn=!musicOn;
  const b=document.getElementById('musicBtn');
  b.classList.toggle('lit',musicOn);
  b.innerHTML=(musicOn?'&#9836;':'&#9834;')+' Musik';
  if(!musicAud){musicAud=new Audio('QiGong.mp3');musicAud.loop=true;musicAud.volume=.45;}
  if(musicOn&&playing)musicAud.play().catch(()=>{});else if(!musicOn)musicAud.pause();
}
function toggleGong(){
  gongOn=!gongOn;
  const b=document.getElementById('gongBtn');
  b.classList.toggle('lit',gongOn);
  b.innerHTML=(gongOn?'&#9679;':'&#9675;')+' Gong';
  if(!gongAud)gongAud=new Audio('Gong.mp3');
}
function fireGong(){
  if(!gongOn)return;
  if(!gongAud)gongAud=new Audio('Gong.mp3');
  gongAud.currentTime=0;gongAud.play().catch(()=>{});
}

/* ── THEME ── */
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  ['light','zen','dark'].forEach(n=>{
    document.getElementById(n==='light'?'tl':n==='zen'?'tz':'td').classList.toggle('on',n===t);
  });
}

/* ── FULLSCREEN ── */
function goFullscreen(){
  const el=document.getElementById('app');
  if(!document.fullscreenElement)el.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

/* ── LIGHTBOX ── */
function openLb(){
  lbIdx=imgIdx;
  renderLb(false);
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow='hidden';
  clearInterval(lbTmr);
  if(EX[idx].imgs.length>1)lbTmr=setInterval(()=>lbStep(1),4200);
}
function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow='';
  clearInterval(lbTmr);
}
function renderLb(fade){
  const e=EX[idx];
  const img=document.getElementById('lbImg');
  document.getElementById('lbCounter').textContent=(lbIdx+1)+' / '+e.imgs.length;
  if(fade){
    img.classList.add('fade');
    setTimeout(()=>{img.src=e.imgs[lbIdx];img.alt=e.title;img.classList.remove('fade');},300);
  } else {
    img.src=e.imgs[lbIdx];img.alt=e.title;
  }
  /* dots */
  document.getElementById('lbDots').innerHTML=
    e.imgs.map((_,i)=>`<div class="lb-dot${i===lbIdx?' on':''}" onclick="lbGo(${i})"></div>`).join('');
}
function lbWrapClick(e){
  /* tapping the image itself advances; tapping outside closes */
  if(e.target.id==='lbImg'){lbStep(1);}
  else closeLb();
}
function lbStep(dir){
  const e=EX[idx];
  lbIdx=(lbIdx+dir+e.imgs.length)%e.imgs.length;
  renderLb(true);
  clearInterval(lbTmr);
  if(e.imgs.length>1)lbTmr=setInterval(()=>lbStep(1),4200);
}
function lbGo(i){lbIdx=i;renderLb(true);clearInterval(lbTmr);if(EX[idx].imgs.length>1)lbTmr=setInterval(()=>lbStep(1),4200);}

/* Touch swipe for lightbox */
(function(){
  let sx=0,sy=0;
  const lb=document.getElementById('lb');
  lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  lb.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>45){dx<0?lbStep(1):lbStep(-1);}
    else if(Math.abs(dy)>Math.abs(dx)&&dy>60)closeLb();
  },{passive:true});
})();

/* Keyboard */
document.addEventListener('keydown',e=>{
  const lb=document.getElementById('lb');
  if(lb.classList.contains('open')){
    if(e.key==='ArrowRight'||e.key==='ArrowDown')lbStep(1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')lbStep(-1);
    if(e.key==='Escape')closeLb();
  } else {
    if(e.key==='ArrowRight')goNext();
    if(e.key==='ArrowLeft')goPrev();
    if(e.key===' '){e.preventDefault();togglePlay();}
  }
});

/* INIT */
gongAud=new Audio('Gong.mp3');
render();
</script>
