        function updateDisplay() {
            const form = forms[currentForm];
            document.getElementById('formNumber').textContent = currentForm + 1;
            document.getElementById('formNameFr').textContent = form.fr;
            document.getElementById('formNameDe').textContent = form.de;
            document.getElementById('section').textContent = form.section;
            
            const progress = ((currentForm + 1) / forms.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
            
            updateTimer();
            
            // Vorlesen wenn aktiviert
            if (voiceEnabled && isRunning) {
                speakForm(form);
            }
        }

        function speakForm(form) {
            // Aktuelle Sprachausgabe stoppen
            window.speechSynthesis.cancel();
            
            // Neue Sprachausgabe erstellen
            const text = `Form ${currentForm + 1}. ${form.de}`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            utterance.rate = 0.9; // Etwas langsamer für besseres Verständnis
            utterance.pitch = 1;
            utterance.volume = 0.8;
            
            window.speechSynthesis.speak(utterance);
        }

        function updateTimer() {
            const totalMinutes = Math.floor(totalSeconds / 60);
            const totalSecs = totalSeconds % 60;
            const totalDuration = forms.length * secondsPerForm;
            const totalMins = Math.floor(totalDuration / 60);
            const totalSecsRemain = totalDuration % 60;
            
            document.getElementById('timer').textContent = 
                `${String(totalMinutes).padStart(2, '0')}:${String(totalSecs).padStart(2, '0')} / ${String(totalMins).padStart(2, '0')}:${String(totalSecsRemain).padStart(2, '0')}`;
        }

        function startPractice() {
            if (!isRunning) {
                isRunning = true;
                isPaused = false;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('pauseBtn').disabled = false;
                document.getElementById('speedSlider').disabled = true;
                
                if (currentForm === 0 && totalSeconds === 0) {
                    bellSound.play().catch(e => {
                        console.log('Klangschale konnte nicht abgespielt werden:', e);
                        alert('Bitte erlauben Sie Audio-Wiedergabe in Ihrem Browser');
                    });
                    setTimeout(() => {
                        if (musicEnabled) {
                            bgMusic.play().catch(e => {
                                console.log('Hintergrundmusik konnte nicht abgespielt werden:', e);
                            });
                        }
                    }, 2000);
                } else {
                    if (musicEnabled) {
                        bgMusic.play().catch(e => {
                            console.log('Hintergrundmusik konnte nicht abgespielt werden:', e);
                        });
                    }
                }
                
                interval = setInterval(() => {
                    formTimer++;
                    totalSeconds++;
                    updateTimer();
                    
                    if (formTimer >= secondsPerForm) {
                        formTimer = 0;
                        currentForm++;
                        
                        if (currentForm >= forms.length) {
                            endPractice();
                        } else {
                            updateDisplay();
                        }
                    }
                }, 1000);
            }
        }

        function pausePractice() {
            if (isRunning && !isPaused) {
                isPaused = true;
                clearInterval(interval);
                bgMusic.pause();
                window.speechSynthesis.cancel(); // Sprachausgabe stoppen beim Pausieren
                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
            }
        }

        function resetPractice() {
            clearInterval(interval);
            isRunning = false;
            isPaused = false;
            currentForm = 0;
            totalSeconds = 0;
            formTimer = 0;
            
            bgMusic.pause();
            bgMusic.currentTime = 0;
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('speedSlider').disabled = false;
            
            updateDisplay();
        }

        function endPractice() {

        function toggleFullscreen() {
            const container = document.getElementById('container');
            const btn = document.getElementById('fullscreenBtn');
            const body = document.body;
            
            if (!document.fullscreenElement) {
                // In Vollbild gehen
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
                container.classList.add('fullscreen');
                body.classList.add('fullscreen');
                btn.textContent = '✕ Vollbild beenden';
            } else {
                // Vollbild beenden
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                container.classList.remove('fullscreen');
                body.classList.remove('fullscreen');
                btn.textContent = '⛶ Vollbild';
            }
        }

                btn.textContent = '🔊 Vorlesen Aus';
                btn.classList.add('active');
                localStorage.setItem('voice', 'enabled');
                
                // Teste Sprachausgabe
                if (!isRunning) {
                    const testUtterance = new SpeechSynthesisUtterance('Vorlesen aktiviert');
                    testUtterance.lang = 'de-DE';
                    testUtterance.rate = 0.9;
                    window.speechSynthesis.speak(testUtterance);
                }
            } else {
                btn.textContent = '🔊 Vorlesen An';
                btn.classList.remove('active');
                localStorage.setItem('voice', 'disabled');
                window.speechSynthesis.cancel();
            }
        }

        // Theme beim Laden wiederherstellen
        window.addEventListener('load', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.getElementById('container').classList.add('dark');
                document.body.classList.add('dark');
                document.getElementById('themeBtn').textContent = '☀️ Light';
            }
            
            const savedVoice = localStorage.getItem('voice');
            if (savedVoice === 'enabled') {
                voiceEnabled = true;
                document.getElementById('voiceBtn').textContent = '🔊 Vorlesen Aus';
                document.getElementById('voiceBtn').classList.add('active');
            }
        });

        // Initialisierung
        updateDisplay();
    </script>
</body>
</html>
